<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>PS Timer PRO FINAL</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:#fff;
}

.topbar{
  display:flex;
  justify-content:space-between;
  padding:15px;
}

.timer h3 {
  text-align: right;
  font-size: 25px;
  margin: 0px 0px 15px 0px;
  font-weight: bold;
}

.admin-btn{
  background:#ff9800;
  border:none;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
}

.ps{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:20px;
  padding:20px;
}

.timer{
  background:#fff;
  color:#000;
  width:260px;
  padding:20px;
  border-radius:20px;
  text-align:center;
}

.time{font-size:26px;}
.cost{color:green;font-weight:bold;}

button{
  width:100%;
  height:45px;
  margin-top:6px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.start{background:#28a745;color:#fff;}
.pause{background:#ffc107;}
.stop{background:#dc3545;color:#fff;}
.reset{background:#6c757d;color:#fff;}

#admin{
  display:none;
  position:fixed;
  inset:0;
  background:#111;
  padding:20px;
  overflow:auto;
}

.log{
  background:#fff;
  color:#000;
  padding:10px;
  margin:10px 0;
  border-radius:10px;
}

.delete{
  background:red;
  color:#fff;
}

.total{
  background:#28a745;
  padding:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="topbar">
  <h2>🎮 PS Timer</h2>
  <button class="admin-btn" onclick="openAdmin()">📊 Admin</button>
</div>

<div class="ps" id="psArea"></div>

<div id="admin">
  <h2>📊 Statistika</h2>
  <button onclick="closeAdmin()">❌ Yopish</button>
  <div id="total" class="total"></div>
  <div id="logs"></div>
</div>

<audio id="beep">
<source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg">
</audio>

<script>

const RATE = 15000;
const LOGS = "ps_logs";
const STATE = "ps_state";

const psArea = document.getElementById("psArea");
const timers = new Map();

/******** CREATE ********/
for(let i=1;i<=4;i++){
psArea.innerHTML+=`
<div class="timer" data-id="${i}">
<h3>${i}-Stol</h3>
<div class="time">00:00:00:000</div>
<div class="cost">0 so'm</div>

<button class="start" onclick="start(this)">Start</button>
<button class="pause" onclick="pause(this)">Pause</button>
<button class="stop" onclick="stop(this)">Stop</button>
<button class="reset" onclick="resetTimer(this)">Reset</button>
</div>`;
}

/******** FORMAT ********/
function money(n){
return n.toLocaleString('ru-RU')+" so'm";
}

/******** TIMER ********/
function start(btn){
const box=btn.closest(".timer");

if(timers.has(box)) return;

if(!box.startTimestamp){
box.startTimestamp=Date.now();
box.pausedTime=0;
}else if(box.pauseStart){
box.pausedTime+=Date.now()-box.pauseStart;
box.pauseStart=null;
}

timers.set(box,setInterval(()=>{
update(box);
saveState();
},50));
}

function pause(btn){
const box=btn.closest(".timer");

if(!timers.has(box)) return;

clearInterval(timers.get(box));
timers.delete(box);

box.pauseStart=Date.now();
saveState();
}

function getElapsed(box){
if(!box.startTimestamp) return 0;

let now=Date.now();

if(box.pauseStart){
now=box.pauseStart;
}

return now-box.startTimestamp-(box.pausedTime||0);
}

function stop(btn){
const box=btn.closest(".timer");

if(timers.has(box)){
clearInterval(timers.get(box));
timers.delete(box);
}

const ms=getElapsed(box);
const cost=Math.floor(ms/3600000*RATE);

saveLog(box.dataset.id,ms,cost);

document.getElementById("beep").play();

box.finalTime=ms;

saveState();
}

/******** RESET ********/
function resetTimer(btn){
const box=btn.closest(".timer");

if(timers.has(box)){
clearInterval(timers.get(box));
timers.delete(box);
}

box.startTimestamp=null;
box.pausedTime=0;
box.pauseStart=null;
box.finalTime=0;

updateUI(box,0,0);
saveState();
}

/******** UPDATE ********/
function update(box){
const ms=getElapsed(box);
const cost=Math.floor(ms/3600000*RATE);
updateUI(box,ms,cost);
}

function updateUI(box,ms,cost){
const h=Math.floor(ms/3600000);
const m=Math.floor(ms/60000)%60;
const s=Math.floor(ms/1000)%60;
const mi=ms%1000;

box.querySelector(".time").innerText=
`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}:${String(mi).padStart(3,"0")}`;

box.querySelector(".cost").innerText=money(cost);
}

/******** STORAGE ********/
function saveState(){
const data=[];
document.querySelectorAll(".timer").forEach(box=>{
data.push({
id:box.dataset.id,
start:box.startTimestamp,
paused:box.pausedTime,
pauseStart:box.pauseStart,
final:box.finalTime
});
});
localStorage.setItem(STATE,JSON.stringify(data));
}

function loadState(){
const data=JSON.parse(localStorage.getItem(STATE)||"[]");

data.forEach(d=>{
const box=document.querySelector(`[data-id="${d.id}"]`);
if(!box) return;

box.startTimestamp=d.start;
box.pausedTime=d.paused||0;
box.pauseStart=d.pauseStart;
box.finalTime=d.final;

if(d.start && !d.pauseStart){
start({closest:()=>box});
}

update(box);
});
}

/******** LOG ********/
function saveLog(id,ms,cost){
const logs=JSON.parse(localStorage.getItem(LOGS)||"[]");

logs.unshift({
stol:id,
vaqt:formatTime(ms),
summa:cost,
sana:new Date().toLocaleString()
});

localStorage.setItem(LOGS,JSON.stringify(logs));
}

function formatTime(ms){
const h=Math.floor(ms/120000);
const m=Math.floor(ms/60000)%60;
const s=Math.floor(ms/1000)%60;
return `${h}:${m}:${s}`;
}

/******** ADMIN ********/
function openAdmin(){
document.getElementById("admin").style.display="block";
renderLogs();
}

function closeAdmin(){
document.getElementById("admin").style.display="none";
}

function renderLogs(){
const logs=JSON.parse(localStorage.getItem(LOGS)||"[]");
const box=document.getElementById("logs");

let total=0;

box.innerHTML=logs.map((l,i)=>{
total+=l.summa;
return `
<div class="log">
<b>Stol ${l.stol}</b><br>
⏱ ${l.vaqt}<br>
💰 ${money(l.summa)}<br>
<small>${l.sana}</small>
<button class="delete" onclick="deleteLog(${i})">O‘chirish</button>
</div>`;
}).join("");

document.getElementById("total").innerText="Jami: "+money(total);
}

function deleteLog(i){
const logs=JSON.parse(localStorage.getItem(LOGS)||"[]");
logs.splice(i,1);
localStorage.setItem(LOGS,JSON.stringify(logs));
renderLogs();
}

/******** INIT ********/
loadState();

</script>

</body>
</html>
